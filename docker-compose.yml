services:
  # Optional local Postgres, for testing the DATABASE_URL path on this machine.
  # The app runs fine without it (data.json fallback), and it needs no PostGIS:
  # distance is haversine in backend/app/core/scoring.py. The postgis image is
  # kept only because it is a superset and costs nothing.
  #
  #   docker compose up -d db
  #   export DATABASE_URL=postgresql://urbanmine:urbanmine@localhost:5432/urbanmine
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: urbanmine
      POSTGRES_PASSWORD: urbanmine
      POSTGRES_DB: urbanmine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
